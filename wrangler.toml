name = "togethertech-olympiagym"
main = "worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]

account_id = "9aad7efc09a1680696bd35b044f8a31d"

# ─── Cloudflare Static Assets (serves ./dist as the frontend) ────────────────
[assets]
directory = "./dist"
binding = "ASSETS"

# ─── Cloudflare D1 Database Binding ──────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "olympia-fitness-db"
database_id = "ed446766-e8b8-49bf-ad46-16d0ae326ec3"

# ─── Cloudflare R2 Bucket Binding ─────────────────────────────────────────────
[[r2_buckets]]
binding = "GYM_PROFILE_PICTURES"
bucket_name = "gym-profile-pictures"

# ─── Environment Variables (non-secret) ──────────────────────────────────────
[vars]
CF_WORKER = "1"
COUNTRY_CODE = "91"

# ─── esbuild define (build-time constants) ────────────────────────────────────
[define]
"__dirname" = "'/'"
"__filename" = "'/index.js'"
"process.env.CF_WORKER" = "'1'"
"process.env.USE_TURSO" = "'0'"
"process.env.VERCEL" = "'0'"

# ─── Module aliases ───────────────────────────────────────────────────────────
[alias]
"@libsql/client" = "@libsql/client/web"
"node-cron" = "./worker/node-cron-stub.cjs"
"better-sqlite3" = "./worker/node-cron-stub.cjs"

# ─── Secrets (set via: wrangler secret put <NAME>) ───────────────────────────
# WHATSAPP_TOKEN
# WHATSAPP_PHONE_NUMBER_ID
# WHATSAPP_BUSINESS_ACCOUNT_ID
